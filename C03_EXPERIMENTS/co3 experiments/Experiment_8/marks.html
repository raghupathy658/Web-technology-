<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 8 - Student Marks Form</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #f8fafc; padding: 2rem; }
    .card { max-width: 600px; margin: 1rem auto; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 2rem; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    h2 { color: #6366f1; margin-bottom: 1.5rem; border-bottom: 2px solid rgba(99,102,241,0.3); padding-bottom: 0.5rem; }
    .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.3rem; }
    label { font-size: 0.88rem; font-weight: 600; color: #94a3b8; }
    input { padding: 0.65rem 0.9rem; font-size: 0.95rem; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #f8fafc; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
  </style>
</head>
<body>
  <div class="card">
    <h2>Experiment 8: Student Marks Form</h2>
    <form action="result" method="POST">
      <div class="grid-2">
        <div class="form-group">
          <label for="studentName">Student Name *</label>
          <input type="text" id="studentName" name="studentName" value="Sadhanandhan R" required>
        </div>

        <div class="form-group">
          <label for="regNo">Register Number *</label>
          <input type="text" id="regNo" name="regNo" value="312822104001" required>
        </div>
      </div>

      <h3 style="font-size: 1rem; color: #6366f1; margin: 1.2rem 0 0.6rem;">Enter Marks for 5 Subjects (0–100)</h3>

      <div class="grid-2">
        <div class="form-group">
          <label for="sub1">Subject 1 Mark *</label>
          <input type="number" id="sub1" name="sub1" min="0" max="100" value="92" required>
        </div>

        <div class="form-group">
          <label for="sub2">Subject 2 Mark *</label>
          <input type="number" id="sub2" name="sub2" min="0" max="100" value="88" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="sub3">Subject 3 Mark *</label>
          <input type="number" id="sub3" name="sub3" min="0" max="100" value="79" required>
        </div>

        <div class="form-group">
          <label for="sub4">Subject 4 Mark *</label>
          <input type="number" id="sub4" name="sub4" min="0" max="100" value="85" required>
        </div>
      </div>

      <div class="form-group">
        <label for="sub5">Subject 5 Mark *</label>
        <input type="number" id="sub5" name="sub5" min="0" max="100" value="95" required>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn">Calculate Result (ResultServlet)</button>
      </div>
    </form>

    <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
      <h3 style="color: #6366f1; font-size: 1.1rem; margin-bottom: 0.5rem;">Captured Servlet Output Screenshot</h3>
      <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 1rem;">Academic result report card generated dynamically by ResultServlet.java with total score, percentage, grade, and pass status:</p>
      <div style="border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden;">
        <img src="output.png" alt="Experiment 8 Output" style="width: 100%; display: block; border-radius: 8px;">
      </div>
    </div>
  </div>
</body>
</html>
