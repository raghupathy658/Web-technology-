<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Quiz Application</title>

    <style>

        /* ===============================
           BASIC RESET
        =============================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );
        }


        /* ===============================
           MAIN CONTAINER
        =============================== */

        .quiz-container {
            width: 100%;
            max-width: 650px;

            background-color: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);
        }


        /* ===============================
           HEADER
        =============================== */

        .header {
            text-align: center;
            margin-bottom: 20px;
        }


        .header h1 {
            color: #4b3f72;
            margin-bottom: 8px;
        }


        .header p {
            color: #777;
            font-size: 14px;
        }


        /* ===============================
           PROGRESS
        =============================== */

        .progress-area {
            margin-bottom: 20px;
        }


        .progress-text {
            display: flex;
            justify-content: space-between;

            margin-bottom: 6px;

            color: #555;

            font-size: 14px;
        }


        .progress-bar {
            width: 100%;
            height: 8px;

            background-color: #e5e7eb;

            border-radius: 10px;

            overflow: hidden;
        }


        #progress {
            width: 0%;
            height: 100%;

            background-color: #667eea;

            transition: width 0.3s;
        }


        /* ===============================
           QUESTION CARD
        =============================== */

        .question-card {
            background-color: #f8f9ff;

            border: 1px solid #e0e3f5;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 20px;
        }


        #question {
            color: #222;

            font-size: 20px;

            margin-bottom: 20px;

            line-height: 1.5;
        }


        /* ===============================
           OPTIONS
        =============================== */

        .options {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .option {
            width: 100%;

            padding: 14px 16px;

            border: 2px solid #ddd;

            border-radius: 10px;

            background-color: white;

            text-align: left;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;
        }


        .option:hover {
            border-color: #667eea;

            background-color: #f0f2ff;
        }


        .option.selected {
            border-color: #667eea;

            background-color: #e8eaff;
        }


        .option.correct {
            border-color: #2ecc71;

            background-color: #dff8e8;

            color: #16803c;
        }


        .option.wrong {
            border-color: #e74c3c;

            background-color: #fde3e0;

            color: #c0392b;
        }


        .option:disabled {
            cursor: not-allowed;
        }


        /* ===============================
           BUTTONS
        =============================== */

        .button-area {
            display: flex;

            justify-content: space-between;

            gap: 10px;
        }


        button {
            border: none;

            border-radius: 8px;

            padding: 12px 22px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        #nextButton {
            background-color: #667eea;

            color: white;

            margin-left: auto;
        }


        #nextButton:hover {
            background-color: #4b3f72;
        }


        #restartButton {
            background-color: #2ecc71;

            color: white;

            display: none;
        }


        #restartButton:hover {
            background-color: #27ae60;
        }


        /* ===============================
           RESULT
        =============================== */

        #result {
            display: none;

            text-align: center;

            padding: 25px;

            background-color: #f5f6ff;

            border-radius: 15px;
        }


        #result h2 {
            color: #4b3f72;

            margin-bottom: 15px;
        }


        #score {
            font-size: 40px;

            font-weight: bold;

            color: #667eea;

            margin-bottom: 10px;
        }


        #resultMessage {
            color: #555;

            margin-bottom: 20px;
        }


        /* ===============================
           RESPONSIVE DESIGN
        =============================== */

        @media (max-width: 500px) {

            .quiz-container {
                padding: 20px;
            }


            .question-card {
                padding: 18px;
            }


            #question {
                font-size: 17px;
            }


            .button-area {
                flex-direction: column;
            }


            #nextButton,
            #restartButton {
                width: 100%;
                margin-left: 0;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         QUIZ CONTAINER
    ================================== -->

    <div class="quiz-container">


        <!-- HEADER -->

        <div class="header">

            <h1>🧠 Online Quiz</h1>

            <p>
                Test your Web Technology knowledge
            </p>

        </div>


        <!-- =================================
             QUIZ SECTION
        ================================== -->

        <div id="quiz">


            <!-- PROGRESS -->

            <div class="progress-area">

                <div class="progress-text">

                    <span id="questionNumber">
                        Question 1 of 10
                    </span>

                    <span id="progressPercent">
                        0%
                    </span>

                </div>


                <div class="progress-bar">

                    <div id="progress"></div>

                </div>

            </div>


            <!-- QUESTION CARD -->

            <div class="question-card">


                <h2 id="question">
                    Question will appear here
                </h2>


                <div
                    class="options"
                    id="options"
                >
                </div>


            </div>


            <!-- BUTTON -->

            <div class="button-area">

                <button id="nextButton">
                    Next Question
                </button>

            </div>


        </div>


        <!-- =================================
             RESULT SECTION
        ================================== -->

        <div id="result">

            <h2>🎉 Quiz Completed!</h2>


            <div id="score">
                0 / 10
            </div>


            <p id="resultMessage">
                Your result will appear here.
            </p>


            <button id="restartButton">
                🔄 Restart Quiz
            </button>

        </div>


    </div>


    <script>


        /* =========================================
           QUIZ DATA
           ARRAY OF OBJECTS
        ========================================= */

        const questions = [

            {
                question:
                    "Which HTML tag is used to create a hyperlink?",

                options: [
                    "<link>",
                    "<a>",
                    "<href>",
                    "<url>"
                ],

                answer: 1
            },


            {
                question:
                    "Which CSS property is used to change text color?",

                options: [
                    "font-color",
                    "text-color",
                    "color",
                    "background"
                ],

                answer: 2
            },


            {
                question:
                    "Which language is used to make webpages interactive?",

                options: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "SQL"
                ],

                answer: 2
            },


            {
                question:
                    "Which method adds an element to the end of an array?",

                options: [
                    "push()",
                    "add()",
                    "insert()",
                    "append()"
                ],

                answer: 0
            },


            {
                question:
                    "Which keyword is used to declare a constant in JavaScript?",

                options: [
                    "var",
                    "let",
                    "constant",
                    "const"
                ],

                answer: 3
            },


            {
                question:
                    "Which CSS layout system arranges items in rows and columns?",

                options: [
                    "Flexbox",
                    "Grid",
                    "Float",
                    "Position"
                ],

                answer: 1
            },


            {
                question:
                    "Which DOM method selects an element by its ID?",

                options: [
                    "getElementById()",
                    "getElement()",
                    "selectById()",
                    "findId()"
                ],

                answer: 0
            },


            {
                question:
                    "Which symbol is used for a single-line comment in JavaScript?",

                options: [
                    "<!-- -->",
                    "/* */",
                    "//",
                    "#"
                ],

                answer: 2
            },


            {
                question:
                    "Which event occurs when a button is clicked?",

                options: [
                    "onchange",
                    "onclick",
                    "onload",
                    "onmouseover"
                ],

                answer: 1
            },


            {
                question:
                    "Which HTML element is used to create a list item?",

                options: [
                    "<list>",
                    "<item>",
                    "<li>",
                    "<ul>"
                ],

                answer: 2
            }

        ];


        /* =========================================
           VARIABLES
        ========================================= */

        let currentQuestion = 0;

        let score = 0;

        let selectedAnswer = null;


        /* =========================================
           GET HTML ELEMENTS
        ========================================= */

        const questionElement =
            document.getElementById("question");

        const optionsElement =
            document.getElementById("options");

        const nextButton =
            document.getElementById("nextButton");

        const questionNumber =
            document.getElementById("questionNumber");

        const progress =
            document.getElementById("progress");

        const progressPercent =
            document.getElementById(
                "progressPercent"
            );

        const quiz =
            document.getElementById("quiz");

        const result =
            document.getElementById("result");

        const scoreElement =
            document.getElementById("score");

        const resultMessage =
            document.getElementById(
                "resultMessage"
            );

        const restartButton =
            document.getElementById(
                "restartButton"
            );


        /* =========================================
           LOAD QUESTION
        ========================================= */

        function loadQuestion() {


            const current =
                questions[currentQuestion];


            /* Display question */

            questionElement.textContent =
                current.question;


            /* Display question number */

            questionNumber.textContent =
                "Question " +
                (currentQuestion + 1) +
                " of " +
                questions.length;


            /* Calculate progress */

            const percent =
                Math.round(
                    (
                        currentQuestion /
                        questions.length
                    ) * 100
                );


            progress.style.width =
                percent + "%";


            progressPercent.textContent =
                percent + "%";


            /* Clear old options */

            optionsElement.innerHTML = "";


            selectedAnswer = null;


            /* =====================================
               CREATE OPTIONS
            ===================================== */

            current.options.forEach(
                function(option, index) {


                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "option";


                    button.textContent =
                        option;


                    /* Click event */

                    button.addEventListener(
                        "click",
                        function() {

                            selectAnswer(
                                index,
                                button
                            );

                        }
                    );


                    optionsElement.appendChild(
                        button
                    );

                }
            );


            nextButton.textContent =
                currentQuestion ===
                questions.length - 1
                    ? "Finish Quiz"
                    : "Next Question";

        }


        /* =========================================
           SELECT ANSWER
        ========================================= */

        function selectAnswer(
            selectedIndex,
            selectedButton
        ) {


            /* Prevent changing answer */

            if (selectedAnswer !== null) {

                return;

            }


            selectedAnswer =
                selectedIndex;


            const correctAnswer =
                questions[
                    currentQuestion
                ].answer;


            const allOptions =
                document.querySelectorAll(
                    ".option"
                );


            /* =====================================
               CHECK ANSWER
            ===================================== */

            if (
                selectedIndex ===
                correctAnswer
            ) {

                selectedButton.classList.add(
                    "correct"
                );

                score++;

            }

            else {

                selectedButton.classList.add(
                    "wrong"
                );


                /* Show correct answer */

                allOptions[
                    correctAnswer
                ].classList.add(
                    "correct"
                );

            }


            /* Disable all buttons */

            allOptions.forEach(
                function(button) {

                    button.disabled = true;

                }
            );

        }


        /* =========================================
           NEXT QUESTION EVENT
        ========================================= */

        nextButton.addEventListener(
            "click",
            function() {


                /* Require answer */

                if (selectedAnswer === null) {

                    alert(
                        "Please select an answer."
                    );

                    return;

                }


                /* Move to next question */

                currentQuestion++;


                if (
                    currentQuestion <
                    questions.length
                ) {

                    loadQuestion();

                }

                else {

                    showResult();

                }

            }
        );


        /* =========================================
           SHOW RESULT
        ========================================= */

        function showResult() {


            quiz.style.display =
                "none";


            result.style.display =
                "block";


            scoreElement.textContent =
                score +
                " / " +
                questions.length;


            const percentage =
                (
                    score /
                    questions.length
                ) * 100;


            /* =====================================
               CONDITIONAL STATEMENT
            ===================================== */

            if (percentage >= 80) {

                resultMessage.textContent =
                    "Excellent! 🌟 You have a very good understanding.";

            }

            else if (percentage >= 60) {

                resultMessage.textContent =
                    "Good job! 👍 Keep improving.";

            }

            else if (percentage >= 40) {

                resultMessage.textContent =
                    "Not bad! 📚 A little more practice will help.";

            }

            else {

                resultMessage.textContent =
                    "Keep practicing! 💪 You can do better.";

            }


            restartButton.style.display =
                "inline-block";

        }


        /* =========================================
           RESTART QUIZ
        ========================================= */

        restartButton.addEventListener(
            "click",
            function() {


                currentQuestion = 0;

                score = 0;

                selectedAnswer = null;


                result.style.display =
                    "none";


                quiz.style.display =
                    "block";


                loadQuestion();

            }
        );


        /* =========================================
           START QUIZ
        ========================================= */

        loadQuestion();


    </script>


</body>

</html>
